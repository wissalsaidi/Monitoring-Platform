server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # En-têtes de sécurité (CSP, X-Frame-Options…) : posés par Laravel, middleware SecurityHeaders (SCRUM-61)

    # DNS de Docker relu toutes les 10 s : quand le conteneur app est recréé (nouvelle IP),
    # nginx le retrouve sans redémarrage. Avec un nom fixe dans fastcgi_pass, l'IP était figée au démarrage (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    charset utf-8;
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
