# Grafana derrière la plateforme (SCRUM-48), inclus dans default.conf et production.conf.
#
# Grafana n'est servi qu'aux utilisateurs connectés à la plateforme, par l'auth proxy de Grafana : avant chaque requête
# vers /grafana/, nginx demande à Laravel (/_grafana_auth) qui est connecté, puis transmet son login à Grafana dans
# X-WEBAUTH-USER. La valeur envoyée par le navigateur est toujours remplacée. Grafana n'accepte cet en-tête que de
# nginx (GF_AUTH_PROXY_WHITELIST : son adresse sur le réseau interne grafana-proxy, 172.31.250.2).

# Sous-requête vers Laravel : session de l'utilisateur (cookies transmis), sans le corps de la requête
location = /_grafana_auth {
    internal;
    fastcgi_pass $php_upstream;
    fastcgi_pass_request_body off;
    fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_param DOCUMENT_URI /index.php;
    fastcgi_param REQUEST_URI /_grafana_auth;
    fastcgi_param REQUEST_METHOD GET;
    fastcgi_param QUERY_STRING "";
    fastcgi_param CONTENT_LENGTH "";
    fastcgi_param CONTENT_TYPE "";
    fastcgi_param SERVER_PROTOCOL $server_protocol;
    fastcgi_param REQUEST_SCHEME $scheme;
    fastcgi_param HTTPS $https if_not_empty;
    fastcgi_param REMOTE_ADDR $remote_addr;
    fastcgi_param SERVER_NAME $server_name;
    fastcgi_param SERVER_PORT $server_port;
}

# Fichiers statiques de Grafana (JS, CSS, images) : publics, sans passer par Laravel
location ^~ /grafana/public/ {
    proxy_set_header Host $host;
    proxy_set_header X-WEBAUTH-USER "";
    proxy_pass http://172.31.250.3:3000;
}

# Mises à jour en direct de Grafana (WebSocket)
location ^~ /grafana/api/live/ {
    auth_request /_grafana_auth;
    auth_request_set $grafana_user $upstream_http_x_webauth_user;
    error_page 401 = @grafana_login;
    error_page 403 = @grafana_no_access;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-WEBAUTH-USER $grafana_user;
    proxy_pass http://172.31.250.3:3000;
}

location ^~ /grafana/ {
    auth_request /_grafana_auth;
    auth_request_set $grafana_user $upstream_http_x_webauth_user;
    auth_request_set $grafana_name $upstream_http_x_webauth_name;
    auth_request_set $grafana_email $upstream_http_x_webauth_email;
    error_page 401 = @grafana_login;
    error_page 403 = @grafana_no_access;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-WEBAUTH-USER $grafana_user;
    proxy_set_header X-WEBAUTH-NAME $grafana_name;
    proxy_set_header X-WEBAUTH-EMAIL $grafana_email;
    # Grafana 11 sous un sous-chemin : en changeant d'organisation (?orgId=), il redirige vers « /grafanad/… »
    # au lieu de « /grafana/d/… ». On remet le « / » manquant.
    proxy_redirect ~^(/grafana)([^/].*)$ $1/$2;
    proxy_pass http://172.31.250.3:3000;
}

# Pas connecté : page de connexion de la plateforme
location @grafana_login {
    absolute_redirect off;   # « Location: /login » relatif : garde l'hôte et le port du navigateur
    return 302 /login;
}

# Connecté mais sans compte Grafana (créé au premier « Open Grafana dashboard ») : retour au dashboard de la plateforme
location @grafana_no_access {
    absolute_redirect off;
    return 302 /;
}
