# nginx de production (SCRUM-61) : HTTPS obligatoire. Utilisé par docker-compose.prod.yml.
# Certificat attendu dans docker/nginx/certs/ : fullchain.pem + privkey.pem (voir docs/exploitation/production.md).

# HTTP : uniquement la redirection vers HTTPS (et le défi Let's Encrypt)
server {
    listen 80;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    root /var/www/html/public;
    index index.php;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # En-têtes de sécurité des pages : middleware Laravel SecurityHeaders (CSP, HSTS, X-Frame-Options…)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    charset utf-8;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Fichiers Vite : nom avec empreinte, donc cache long. Pas de passage par Laravel : en-têtes posés ici.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;   # contient HTTPS=on sur ce port : Laravel voit la requête en HTTPS (URLs, HSTS)
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
