# Production (SCRUM-61) : à combiner avec docker-compose.yml
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# - nginx en HTTPS (ports 80 → redirection, 443), certificat dans docker/nginx/certs/
# - plus aucune base ni outil de dev publié sur la machine
# - phpMyAdmin, Mailpit et la fake API ne démarrent pas (profil "dev")
# Procédure complète : docs/exploitation/production.md

services:
  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    volumes: !override
      - ./:/var/www/html:ro
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./docker/nginx/certbot:/var/www/certbot:ro
    restart: unless-stopped

  app:
    restart: unless-stopped

  mysql:
    ports: !reset []
    restart: unless-stopped

  redis:
    restart: unless-stopped

  zabbix-db:
    restart: unless-stopped

  zabbix-server:
    restart: unless-stopped

  # Interface Zabbix et Grafana : réservées à l'administrateur, accès par tunnel SSH (ssh -L 8080:127.0.0.1:8080 …)
  zabbix-web:
    restart: unless-stopped

  grafana:
    restart: unless-stopped

  phpmyadmin:
    profiles: [dev]

  mailpit:
    profiles: [dev]

  fake-api:
    profiles: [dev]
